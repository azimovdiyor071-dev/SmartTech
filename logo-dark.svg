<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171e33"/>
    </linearGradient>
    <linearGradient id="emblem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="56" fill="url(#bg)"/>

  <!-- Stylised "S" network emblem -->
  <g transform="translate(118,20)" filter="url(#glow)">
    <path d="M172 98 C172 76 144 68 120 74 C96 80 92 104 116 112 C156 126 168 132 168 156 C168 180 136 188 104 176"
          fill="none" stroke="url(#emblem)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="172" cy="98" r="17" fill="#93c5fd"/>
    <circle cx="104" cy="176" r="17" fill="#c4b5fd"/>
    <circle cx="136" cy="128" r="9" fill="#e0e7ff"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="330" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif"
        font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1">SmartTech</text>
  <text x="256" y="378" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif"
        font-size="30" font-weight="600" fill="#8b97b3" letter-spacing="10">CRM</text>
</svg>
