name: Keep server awake

# Pings the health endpoint frequently so the free Render instance never sleeps
# — the site then loads instantly instead of a 30–60s cold start.
# GitHub's scheduler can lag, so we run every 5 min AND spread a few pings per
# run to cover the gaps and stay under Render's ~15 min idle timeout.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Don't pile up overlapping runs.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health a few times
        run: |
          URL="https://smarttech-6pr1.onrender.com/api/health"
          ok=0
          for i in 1 2 3 4; do
            code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "Ping $i → HTTP $code"
            [ "$code" = "200" ] && ok=1
            [ "$i" -lt 4 ] && sleep 60
          done
          if [ "$ok" = "1" ]; then echo "Server is awake ✅"; else echo "No 200 (may be deploying) — next run retries."; fi
