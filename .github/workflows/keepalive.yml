name: Keep server awake

# Pings the health endpoint every ~10 minutes so the free Render instance
# doesn't sleep — the site then loads instantly instead of a 30–60s cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="https://smarttech-6pr1.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "No 200 yet (server may be deploying) — will try again next run."
