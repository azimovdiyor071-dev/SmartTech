<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.5" stop-color="#12182b"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="230" fill="#4f46e5" opacity="0.10"/>
  <circle cx="130" cy="980" r="220" fill="#7c3aed" opacity="0.10"/>

  <!-- Emblem -->
  <g transform="translate(472,60) scale(2.0)" filter="url(#glow)">
    <path d="M43 24.5 C43 19 36 17 30 18.5 C24 20 23 26 29 28 C39 31.5 42 33 42 39 C42 45 34 47 26 44"
          fill="none" stroke="url(#em)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="43" cy="24.5" r="4.6" fill="#93c5fd"/>
    <circle cx="26" cy="44" r="4.6" fill="#c4b5fd"/>
    <circle cx="34" cy="32" r="2.6" fill="#e0e7ff"/>
  </g>

  <text x="540" y="252" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1">SmartTech</text>
  <text x="540" y="292" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="27" font-weight="600" fill="#8b97b3" letter-spacing="11">CRM</text>

  <!-- Headline -->
  <text x="540" y="382" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="45" font-weight="800" fill="#ffffff">Elektronika do‘koni uchun</text>
  <text x="540" y="437" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="45" font-weight="800" fill="#a78bfa">zamonaviy boshqaruv tizimi</text>

