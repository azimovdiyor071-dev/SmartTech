  <g font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="30" fill="#dbe2ee">
    <circle cx="200" cy="533" r="7" fill="url(#em)"/><text x="228" y="543">Ombor va savdo — real vaqtda nazorat</text>
    <circle cx="200" cy="601" r="7" fill="url(#em)"/><text x="228" y="611">Sun'iy intellekt yordamchisi (savol → javob)</text>
    <circle cx="200" cy="669" r="7" fill="url(#em)"/><text x="228" y="679">Mijozlar, hisob-faktura, PDF hisobotlar</text>
    <circle cx="200" cy="737" r="7" fill="url(#em)"/><text x="228" y="747">3 tilda · telefon va kompyuterda ishlaydi</text>
    <circle cx="200" cy="805" r="7" fill="url(#em)"/><text x="228" y="815">Kam qolgan mahsulot haqida ogohlantirish</text>
  </g>

  <!-- Demo link pill -->
  <rect x="255" y="878" width="570" height="82" rx="41" fill="url(#pill)"/>
  <text x="540" y="912" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="22" font-weight="600" fill="#c7d2fe" letter-spacing="3">BEPUL SINAB KO‘RING</text>
  <text x="540" y="940" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">smarttech-6pr1.onrender.com</text>

  <text x="540" y="1018" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="24" fill="#8b97b3">Kirish:  admin@smarttech.uz  /  demo1234</text>
